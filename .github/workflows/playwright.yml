name: Playwright BDD Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'             # adds a "Run workflow" button in GitHub

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:                        # values come from GitHub Secrets (Step 4)
      BASE_URL: ${{ secrets.BASE_URL }}
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      AUTH_API_URL: ${{ secrets.AUTH_API_URL }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps 

      - name: Run tests
        run: npm test

      - name: Set up Java (for Allure)
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure + listener reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-and-listener-reports
          path: |
            allure-report/
            reports/
          retention-days: 14